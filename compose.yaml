name: luxsabers-social

x-common: &common
  restart: unless-stopped
  networks: [internal]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: '2'}

services:
  mongodb:
    <<: *common
    image: ${MONGO_IMAGE:?Pinned image required}
    cpus: 0.4
    mem_limit: 1024m
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/private/mongo-root-password
    entrypoint: [sh, /scripts/mongo-entrypoint.sh]
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./.private/mongo-root-password:/run/private/mongo-root-password:ro
      - ./.private/replica.key:/run/private/replica.key:ro
      - ./scripts:/scripts:ro
    healthcheck:
      test: [CMD, mongosh, --quiet, --file, /scripts/mongo-health.js]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 60s

  mongo-init:
    <<: *common
    image: ${MONGO_IMAGE:?Pinned image required}
    restart: 'no'
    cpus: 0.25
    mem_limit: 256m
    depends_on: {mongodb: {condition: service_started}}
    entrypoint: [mongosh, --nodb, --quiet, --file, /scripts/mongo-init.js]
    volumes:
      - ./.private/mongodb.json:/run/private/mongodb.json:ro
      - ./scripts:/scripts:ro

  redis:
    <<: *common
    image: ${REDIS_IMAGE:?Pinned image required}
    cpus: 0.15
    mem_limit: 192m
    env_file: ./.private/redis.env
    entrypoint: [sh, /scripts/redis-entrypoint.sh]
    tmpfs: ['/tmp:size=8m,mode=1777']
    volumes:
      - redis-data:/data
      - ./.private/redis.conf:/run/private/redis.conf:ro
      - ./scripts/redis-entrypoint.sh:/scripts/redis-entrypoint.sh:ro
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 20s
      timeout: 5s
      retries: 5

  storage:
    <<: *common
    image: ${STORAGE_IMAGE:?Pinned image required}
    cpus: 0.3
    mem_limit: 1024m
    env_file: ./.private/storage.env
    volumes: [storage-data:/data]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/health]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s

  storage-init:
    <<: *common
    image: luxsabers-social-gateway:${RELEASE_ID:?Release identifier required}
    restart: 'no'
    user: '${DEPLOY_UID:?}:${DEPLOY_GID:?}'
    cpus: 0.25
    mem_limit: 256m
    depends_on: {storage: {condition: service_healthy}}
    command: [node, gateway/init-storage.mjs]
    volumes: ['./.private/gateway.json:/run/private/gateway.json:ro']

  ai:
    <<: *common
    image: ${AI_IMAGE:?Pinned image required}
    user: '${DEPLOY_UID:?}:${DEPLOY_GID:?}'
    command: [node, apps/aitoearn-ai/src/main.js, -c, config.yaml]
    tmpfs: ['/app/.claude-session:size=32m,uid=${DEPLOY_UID:?},gid=${DEPLOY_GID:?},mode=0700']
    cpus: 0.4
    mem_limit: 768m
    cap_drop: [ALL]
    depends_on:
      mongo-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    volumes: ['./.private/ai.yaml:/app/config.yaml:ro']
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:3010/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  server:
    <<: *common
    image: luxsabers-social-server:${RELEASE_ID:?Release identifier required}
    build:
      context: .
      dockerfile: server/Dockerfile
      args: {SERVER_IMAGE: '${SERVER_IMAGE:?Pinned image required}'}
    user: '${DEPLOY_UID:?}:${DEPLOY_GID:?}'
    command: [node, apps/aitoearn-server/src/main.js, -c, config.yaml]
    cpus: 0.4
    mem_limit: 512m
    cap_drop: [ALL]
    depends_on: {ai: {condition: service_healthy}, automation-init: {condition: service_completed_successfully}}
    volumes: ['./.private/server.yaml:/app/config.yaml:ro']
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  web:
    <<: *common
    image: ${WEB_IMAGE:?Pinned image required}
    cpus: 0.3
    mem_limit: 512m
    cap_drop: [ALL]
    environment: {NODE_ENV: production, NEXT_TELEMETRY_DISABLED: '1'}
    command: [node, server.js]
    depends_on: {server: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:3000/en',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  gateway:
    <<: *common
    image: luxsabers-social-gateway:${RELEASE_ID:?Release identifier required}
    build:
      context: .
      dockerfile: gateway/Dockerfile
      args: {NODE_IMAGE: '${NODE_IMAGE:?Pinned image required}'}
    user: '${DEPLOY_UID:?}:${DEPLOY_GID:?}'
    networks: [internal, entry]
    cpus: 0.25
    mem_limit: 256m
    cap_drop: [ALL]
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    ports: ['127.0.0.1:18880:8080', '127.0.0.1:19000:8081']
    volumes:
      - ./.private/gateway.json:/run/private/gateway.json:ro
      - ./.private/automation.json:/run/private/automation.json:ro
      - ./.private/automation-authority.json:/run/private/automation-authority.json:ro
      - ./.runtime/automation:/data
    depends_on: {web: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:8080/healthz',{headers:{Host:'127.0.0.1:18880'}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5

  automation-init:
    <<: *common
    image: luxsabers-social-gateway:${RELEASE_ID:?Release identifier required}
    user: '${DEPLOY_UID:?}:${DEPLOY_GID:?}'
    restart: 'no'
    cpus: 0.15
    mem_limit: 128m
    cap_drop: [ALL]
    read_only: true
    command: [node, automation/worker.mjs, --guard]
    volumes: ['./.private/automation.json:/run/private/automation.json:ro']
    depends_on: {redis: {condition: service_healthy}}

  automation:
    <<: *common
    image: luxsabers-social-gateway:${RELEASE_ID:?Release identifier required}
    user: '${DEPLOY_UID:?}:${DEPLOY_GID:?}'
    networks: [internal, entry]
    cpus: 0.2
    mem_limit: 192m
    cap_drop: [ALL]
    read_only: true
    command: [node, automation/worker.mjs]
    volumes:
      - ./.private/automation.json:/run/private/automation.json:ro
      - ./.private/automation-authority.json:/run/private/automation-authority.json:ro
      - ./.runtime/automation:/data
    depends_on: {server: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, automation/health.mjs]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  internal: {internal: true}
  entry: {}

volumes:
  mongo-data: {}
  mongo-config: {}
  redis-data: {}
  storage-data: {}
